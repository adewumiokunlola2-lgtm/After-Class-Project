<!DOCTYPE html>
<html>
    <head>
        <title>Perimeter Calculator</title>
    </head>
    <body>
        <script>
            var choice = prompt("Welcome to Perimeter Calculator. \n Please Enter your Choice. \n1. Perimeter of Rectangle.  \n2.Perimeter of Triangle. \n3.Perimeter of Circle. \n4.Perimeter of Square")

            
if (choice == '1') {

var l = prompt('Enter the Height')

var b = prompt('Enter the Width')

var result = 2 * (Number(l) + Number(b))

alert('The Perimeter is ' + result)

}



if (choice == '2') {

var h = prompt("Enter the length of the height")

var b = prompt("Enter the length of the base")

var c = prompt("Enter the length of the other side")

var result = Number(h) + Number(b) + Number(c)

alert('The Perimeter is ' + result)

}

if (choice == '3') {

var r = prompt("Enter the radius")

var result = 2 * 3.14 * Number(r)

alert('The Perimeter is ' + result)

}

if (choice == '4') {

var s = prompt("Enter the length of the sides")

var result = 4 * Number(s)

alert('The Perimeter is ' + result)

}
        </script>
    </body>
</html>
