<!DOCTYPE html>
<html>
<body>
<h2>Object Data Structure and Array</h2>
<p id="myjoin"></p>
<p id="myfirstpop"></p>
<p id="mysecondpop"></p>
<script>
var sports = ["Volleyball", "Cricket", "Badminton", "Football"];
document.getElementById("myjoin").innerHTML = sports.join(" * ");
document.getElementById("myfirstpop").innerHTML = sports;
sports.pop();
document.getElementById("mysecondpop").innerHTML = sports;
</script>
</body>
</html>
